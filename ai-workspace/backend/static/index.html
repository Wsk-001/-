<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      background: #212121;
      color: #ececec;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #424242;
      padding: 12px 16px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header .session-id { font-size: 11px; color: #b4b4b4; }

    /* Chat area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
    }
    .chat-inner {
      max-width: 768px;
      margin: 0 auto;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }
    .empty-state .icon { font-size: 36px; margin-bottom: 16px; }
    .empty-state h2 { font-size: 20px; margin-bottom: 8px; }
    .empty-state p { color: #b4b4b4; font-size: 14px; max-width: 400px; }
    .hints { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 24px; }
    .hints span {
      padding: 6px 14px;
      border: 1px solid #424242;
      border-radius: 20px;
      font-size: 13px;
      color: #b4b4b4;
      cursor: default;
    }

    /* Messages */
    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .message.user { justify-content: flex-end; }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .avatar.ai { background: #10a37f; color: #fff; }
    .avatar.u { background: #5436DA; color: #fff; }
    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.7;
    }
    .message.user .bubble { background: #2f2f2f; }
    .message.assistant .bubble { background: transparent; padding-left: 0; }

    /* Markdown-like rendering */
    .bubble pre {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
    }
    .bubble code {
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
    }
    .bubble :not(pre) > code {
      background: #3a3a3a;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { padding-left: 24px; margin: 8px 0; }
    .bubble li { margin: 4px 0; }
    .bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 6px; font-weight: 600; }

    /* Streaming cursor */
    .streaming::after {
      content: '\2588';
      animation: blink 1s infinite;
      color: #10a37f;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Input area */
    .input-area {
      border-top: 1px solid #424242;
      padding: 16px;
      flex-shrink: 0;
    }
    .input-inner {
      max-width: 768px;
      margin: 0 auto;
    }
    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      background: #2f2f2f;
      border: 1px solid #424242;
      border-radius: 16px;
      padding: 12px 16px;
      transition: border-color 0.2s;
    }
    .input-box:focus-within { border-color: #10a37f; }
    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ececec;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 200px;
      line-height: 1.5;
    }
    .input-box textarea::placeholder { color: #8e8e8e; }
    .btn {
      width: 36px; height: 36px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .btn-send { background: #10a37f; color: #fff; }
    .btn-send:hover { background: #1a7f64; }
    .btn-send:disabled { background: #424242; cursor: not-allowed; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-stop:hover { background: #dc2626; }
    .disclaimer {
      text-align: center;
      font-size: 11px;
      color: #8e8e8e;
      margin-top: 8px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #424242; border-radius: 3px; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>AI Workspace</h1>
    <span class="session-id" id="sessionId"></span>
  </div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea">
    <div class="chat-inner" id="chatInner">
      <div class="empty-state" id="emptyState">
        <div class="icon">&#10022;</div>
        <h2>AI Workspace</h2>
        <p>Start a conversation. Multi-turn chat with streaming output.</p>
        <div class="hints">
          <span>Explain quantum computing</span>
          <span>Write a Python quicksort</span>
          <span>Help me design an API</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-inner">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="Send a message..."></textarea>
        <button class="btn btn-send" id="sendBtn" onclick="sendMessage()" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/>
          </svg>
        </button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopStream()" title="Stop" style="display:none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
        </button>
      </div>
      <div class="disclaimer">AI Workspace may make mistakes. Verify important information.</div>
    </div>
  </div>

<script>
  // Generate session ID
  var sessionId = 'sess-' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
  document.getElementById('sessionId').textContent = 'Session: ' + sessionId.substr(0, 14) + '...';

  var messages = [];
  var isStreaming = false;
  var abortController = null;
  var chatInner = document.getElementById('chatInner');
  var emptyState = document.getElementById('emptyState');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var stopBtn = document.getElementById('stopBtn');
  var chatArea = document.getElementById('chatArea');

  // Auto-resize textarea
  input.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
  });

  // Enter to send
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendMessage() {
    var text = input.value.trim();
    if (!text || isStreaming) return;

    // Hide empty state
    if (emptyState) emptyState.style.display = 'none';

    // Add user message
    addMessage('user', text);

    // Add empty assistant message
    var assistantEl = addMessage('assistant', '');

    input.value = '';
    input.style.height = 'auto';
    isStreaming = true;
    sendBtn.style.display = 'none';
    stopBtn.style.display = 'flex';

    abortController = new AbortController();

    fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
      signal: abortController.signal
    })
    .then(function(res) {
      if (!res.ok) return res.text().then(function(t) { throw new Error('HTTP ' + res.status + ': ' + t); });
      return res.body;
    })
    .then(function(body) {
      if (!body) throw new Error('No response body');
      var reader = body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      var bubbleEl = assistantEl.querySelector('.bubble');

      function read() {
        reader.read().then(function(result) {
          if (result.done) {
            finishStream();
            return;
          }
          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line || line.indexOf('data: ') !== 0) continue;
            try {
              var data = JSON.parse(line.slice(6));
              if (data.error) {
                bubbleEl.textContent = 'Error: ' + data.error;
                finishStream();
                return;
              } else if (data.done) {
                finishStream();
                return;
              } else if (data.token) {
                bubbleEl.textContent += data.token;
                scrollToBottom();
              }
            } catch(e) {}
          }
          read();
        });
      }
      read();
    })
    .catch(function(err) {
      if (err.name === 'AbortError') {
        finishStream();
        return;
      }
      var bubbleEl = assistantEl.querySelector('.bubble');
      bubbleEl.textContent = 'Error: ' + err.message;
      finishStream();
    });
  }

  function stopStream() {
    if (abortController) {
      abortController.abort();
      abortController = null;
    }
    finishStream();
  }

  function finishStream() {
    isStreaming = false;
    sendBtn.style.display = 'flex';
    stopBtn.style.display = 'none';
    // Remove streaming cursor
    var streaming = document.querySelector('.streaming');
    if (streaming) streaming.classList.remove('streaming');
    input.focus();
  }

  function addMessage(role, content) {
    var div = document.createElement('div');
    div.className = 'message ' + role;

    var avatar = document.createElement('div');
    avatar.className = 'avatar ' + (role === 'user' ? 'u' : 'ai');
    avatar.textContent = role === 'user' ? 'U' : 'AI';

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'assistant' && !content) {
      bubble.textContent = 'Thinking...';
      bubble.classList.add('streaming');
    } else {
      bubble.textContent = content;
    }

    if (role === 'user') {
      div.appendChild(bubble);
      div.appendChild(avatar);
    } else {
      div.appendChild(avatar);
      div.appendChild(bubble);
    }

    chatInner.appendChild(div);
    scrollToBottom();
    return div;
  }

  function scrollToBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }
</script>
</body>
</html>
