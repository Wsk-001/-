<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #212121;
      color: #ececec;
      font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ===== 侧边栏 ===== */
    .sidebar {
      width: 260px;
      background: #171717;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.3s;
    }
    .sidebar.collapsed { width: 0; overflow: hidden; }

    .sidebar-header {
      padding: 12px;
    }
    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #424242;
      border-radius: 10px;
      background: transparent;
      color: #ececec;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .new-chat-btn:hover { background: #2f2f2f; }
    .new-chat-btn svg { flex-shrink: 0; }

    .sidebar-search {
      padding: 8px 12px;
    }
    .sidebar-search input {
      width: 100%;
      padding: 10px 12px;
      background: #2f2f2f;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #ececec;
      font-size: 13px;
      outline: none;
    }
    .sidebar-search input:focus { border-color: #10a37f; }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }
    .chat-list-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #b4b4b4;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .chat-list-item:hover { background: #2f2f2f; color: #ececec; }
    .chat-list-item.active { background: #2f2f2f; color: #ececec; }

    .sidebar-footer {
      padding: 8px 12px;
      border-top: 1px solid #2f2f2f;
    }
    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .user-card:hover { background: #2f2f2f; }
    .user-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #10a37f;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      flex-shrink: 0;
    }
    .user-info { font-size: 13px; flex: 1; overflow: hidden; }
    .user-info .name { color: #ececec; font-weight: 500; }
    .user-info .plan { color: #8e8e8e; font-size: 11px; }

    /* ===== 主聊天区 ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #2f2f2f;
      flex-shrink: 0;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sidebar-toggle {
      background: none;
      border: none;
      color: #b4b4b4;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
    }
    .sidebar-toggle:hover { background: #2f2f2f; color: #ececec; }

    .model-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 500;
      color: #ececec;
      transition: background 0.15s;
    }
    .model-selector:hover { background: #2f2f2f; }
    .model-selector svg { color: #8e8e8e; }

    .topbar-right {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #b4b4b4;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
    }
    .icon-btn:hover { background: #2f2f2f; color: #ececec; }

    /* ===== 聊天内容 ===== */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .chat-container {
      max-width: 768px;
      margin: 0 auto;
      padding: 24px 16px 160px;
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
    }
    .empty-state .logo {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #10a37f;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
    }
    .empty-state .logo svg { color: #fff; }
    .empty-state h1 {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 28px;
    }
    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 640px;
      width: 100%;
    }
    .suggestion-card {
      padding: 16px;
      border: 1px solid #424242;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
      background: transparent;
      color: #ececec;
    }
    .suggestion-card:hover { background: #2f2f2f; }
    .suggestion-card .title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .suggestion-card .desc { font-size: 13px; color: #8e8e8e; line-height: 1.5; }

    /* 消息 */
    .message {
      margin-bottom: 32px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      flex-shrink: 0;
    }
    .msg-avatar.assistant { background: #10a37f; color: #fff; }
    .msg-avatar.user { background: #5436DA; color: #fff; }
    .msg-role { font-size: 13px; font-weight: 600; color: #ececec; }

    .message-content {
      padding-left: 38px;
      font-size: 15px;
      line-height: 1.75;
      color: #ececec;
      word-wrap: break-word;
    }

    /* Markdown */
    .message-content p { margin-bottom: 12px; }
    .message-content p:last-child { margin-bottom: 0; }
    .message-content pre {
      background: #0d0d0d;
      border: 1px solid #2f2f2f;
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
    }
    .message-content code {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 14px;
    }
    .message-content :not(pre) > code {
      background: #2f2f2f;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .message-content ul, .message-content ol {
      padding-left: 24px;
      margin: 12px 0;
    }
    .message-content li { margin: 6px 0; }
    .message-content h1, .message-content h2, .message-content h3 {
      margin: 16px 0 8px;
      font-weight: 600;
    }
    .message-content h1 { font-size: 1.4em; }
    .message-content h2 { font-size: 1.25em; }
    .message-content h3 { font-size: 1.1em; }
    .message-content blockquote {
      border-left: 3px solid #424242;
      padding-left: 16px;
      margin: 12px 0;
      color: #b4b4b4;
    }
    .message-content table {
      border-collapse: collapse;
      margin: 12px 0;
      width: 100%;
    }
    .message-content th, .message-content td {
      border: 1px solid #424242;
      padding: 8px 12px;
      text-align: left;
    }
    .message-content th { background: #2f2f2f; font-weight: 600; }

    /* 用户消息 */
    .message.user .message-content {
      background: #2f2f2f;
      border-radius: 16px;
      padding: 12px 16px;
      display: inline-block;
      max-width: 100%;
    }

    /* 流式光标 */
    .streaming-cursor::after {
      content: '\2588';
      animation: blink 1s steps(2) infinite;
      color: #10a37f;
      margin-left: 2px;
      font-weight: normal;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* 思考动画 */
    .thinking-dots span {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #8e8e8e;
      margin: 0 2px;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
    .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* ===== 输入区 ===== */
    .input-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 16px 24px;
      background: linear-gradient(to bottom, transparent, #212121 40%);
    }
    .input-container {
      max-width: 768px;
      margin: 0 auto;
      background: #2f2f2f;
      border: 1px solid #424242;
      border-radius: 28px;
      padding: 8px 8px 8px 20px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .input-container:focus-within {
      border-color: #666;
    }
    .input-container textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ececec;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      max-height: 200px;
      min-height: 24px;
      padding: 10px 0;
      line-height: 1.5;
    }
    .input-container textarea::placeholder { color: #8e8e8e; }

    .send-btn {
      width: 36px; height: 36px;
      border: none;
      border-radius: 50%;
      background: #ececec;
      color: #212121;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .send-btn:hover { background: #fff; }
    .send-btn:disabled {
      background: #424242;
      color: #8e8e8e;
      cursor: not-allowed;
    }
    .send-btn.stop {
      background: #10a37f;
      color: #fff;
    }
    .send-btn.stop:hover { background: #1a7f64; }

    .input-footer {
      text-align: center;
      font-size: 12px;
      color: #8e8e8e;
      margin-top: 8px;
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #424242; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    /* 响应式 */
    @media (max-width: 768px) {
      .sidebar { position: absolute; z-index: 100; height: 100%; }
      .suggestions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="newChat()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>新建对话</span>
      </button>
    </div>
    <div class="sidebar-search">
      <input type="text" placeholder="搜索对话..." id="searchInput" oninput="filterChats()">
    </div>
    <div class="chat-list" id="chatList">
      <!-- 动态生成 -->
    </div>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">U</div>
        <div class="user-info">
          <div class="name">用户</div>
          <div class="plan">免费版</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===== 主聊天区 ===== -->
  <main class="main">
    <!-- 顶栏 -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="切换侧边栏">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
        <div class="model-selector" id="modelSelector">
          <span>AI Workspace</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" title="分享" onclick="shareChat()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/>
          </svg>
        </button>
        <button class="icon-btn" title="设置" onclick="openSettings()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 聊天滚动区 -->
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-container" id="chatContainer">
        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">
          <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <h1>有什么可以帮你的？</h1>
          <div class="suggestions">
            <div class="suggestion-card" onclick="useSuggestion('请用通俗易懂的方式解释量子计算')">
              <div class="title">解释量子计算</div>
              <div class="desc">用通俗易懂的方式解释量子计算的基本概念</div>
            </div>
            <div class="suggestion-card" onclick="useSuggestion('用Python写一个快速排序算法，并解释原理')">
              <div class="title">编写代码</div>
              <div class="desc">用Python写一个快速排序算法，并解释原理</div>
            </div>
            <div class="suggestion-card" onclick="useSuggestion('帮我设计一个用户登录的REST API接口')">
              <div class="title">设计API</div>
              <div class="desc">帮我设计一个用户登录的REST API接口</div>
            </div>
            <div class="suggestion-card" onclick="useSuggestion('写一首关于春天的现代诗')">
              <div class="title">创意写作</div>
              <div class="desc">写一首关于春天的现代诗</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="input-wrapper">
      <div class="input-container">
        <textarea id="input" rows="1" placeholder="发送消息" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
      </div>
      <div class="input-footer">AI Workspace 可能会犯错，请核实重要信息</div>
    </div>
  </main>
</div>

<script>
  // ===== 状态管理 =====
  var chats = {};          // { sessionId: { title, messages: [...] } }
  var currentSessionId = null;
  var isStreaming = false;
  var abortController = null;

  // DOM
  var chatScroll = document.getElementById('chatScroll');
  var chatContainer = document.getElementById('chatContainer');
  var emptyState = document.getElementById('emptyState');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var chatList = document.getElementById('chatList');

  // ===== 简易 Markdown 渲染 =====
  function renderMarkdown(text) {
    if (!text) return '';
    var html = text;

    // 代码块 ```lang\ncode```
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, function(m, lang, code) {
      return '<pre><code>' + escapeHtml(code.trim()) + '</code></pre>';
    });

    // 行内代码 `code`
    html = html.replace(/`([^`]+)`/g, function(m, code) {
      return '<code>' + escapeHtml(code) + '</code>';
    });

    // 标题
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

    // 引用
    html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

    // 列表
    html = html.replace(/^\* (.+)$/gm, '<li>$1</li>');
    html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, function(m) {
      return '<ul>' + m + '</ul>';
    });

    // 有序列表
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

    // 粗体 / 斜体
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

    // 换行
    html = html.replace(/\n/g, '<br>');

    // 清理多余br
    html = html.replace(/<br><\/li>/g, '</li>');
    html = html.replace(/<br><(h\d|pre|ul|blockquote)/g, '<$1');
    html = html.replace(/<\/(h\d|pre|ul|blockquote)><br>/g, '</$1>');

    return html;
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ===== 会话管理 =====
  function genId() {
    return 'sess-' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
  }

  function newChat() {
    currentSessionId = genId();
    chats[currentSessionId] = { title: '新对话', messages: [] };
    renderChatList();
    renderMessages();
    input.focus();
  }

  function switchChat(sessionId) {
    currentSessionId = sessionId;
    renderChatList();
    renderMessages();
  }

  function renderChatList() {
    chatList.innerHTML = '';
    var keys = Object.keys(chats).reverse();
    for (var i = 0; i < keys.length; i++) {
      var id = keys[i];
      var chat = chats[id];
      var item = document.createElement('div');
      item.className = 'chat-list-item' + (id === currentSessionId ? ' active' : '');
      item.textContent = chat.title;
      item.onclick = (function(sid) {
        return function() { switchChat(sid); };
      })(id);
      chatList.appendChild(item);
    }
  }

  function filterChats() {
    var q = document.getElementById('searchInput').value.toLowerCase();
    var items = chatList.querySelectorAll('.chat-list-item');
    for (var i = 0; i < items.length; i++) {
      var visible = items[i].textContent.toLowerCase().indexOf(q) >= 0;
      items[i].style.display = visible ? '' : 'none';
    }
  }

  // ===== 消息渲染 =====
  function renderMessages() {
    var chat = chats[currentSessionId];
    if (!chat || chat.messages.length === 0) {
      emptyState.style.display = '';
      // 清空消息（保留emptyState）
      var msgs = chatContainer.querySelectorAll('.message');
      for (var i = 0; i < msgs.length; i++) msgs[i].remove();
      return;
    }

    emptyState.style.display = 'none';

    // 清空并重新渲染
    var oldMsgs = chatContainer.querySelectorAll('.message');
    for (var j = 0; j < oldMsgs.length; j++) oldMsgs[j].remove();

    for (var k = 0; k < chat.messages.length; k++) {
      appendMessage(chat.messages[k]);
    }
    scrollToBottom();
  }

  function appendMessage(msg) {
    var div = document.createElement('div');
    div.className = 'message ' + msg.role;

    var header = document.createElement('div');
    header.className = 'message-header';
    var avatar = document.createElement('div');
    avatar.className = 'msg-avatar ' + msg.role;
    avatar.textContent = msg.role === 'user' ? 'U' : 'AI';
    var role = document.createElement('div');
    role.className = 'msg-role';
    role.textContent = msg.role === 'user' ? '你' : 'AI Workspace';
    header.appendChild(avatar);
    header.appendChild(role);

    var content = document.createElement('div');
    content.className = 'message-content';

    if (msg.role === 'user') {
      content.textContent = msg.content;
    } else {
      if (msg.content) {
        content.innerHTML = renderMarkdown(msg.content);
      } else {
        content.innerHTML = '<div class="thinking-dots"><span></span><span></span><span></span></div>';
      }
    }

    div.appendChild(header);
    div.appendChild(content);
    chatContainer.appendChild(div);

    return div;
  }

  function updateLastAssistant(content, streaming) {
    var msgs = chatContainer.querySelectorAll('.message.assistant');
    if (msgs.length === 0) return;
    var last = msgs[msgs.length - 1];
    var contentEl = last.querySelector('.message-content');
    if (content) {
      contentEl.innerHTML = renderMarkdown(content);
      if (streaming) {
        contentEl.classList.add('streaming-cursor');
      } else {
        contentEl.classList.remove('streaming-cursor');
      }
    }
  }

  function scrollToBottom() {
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  // ===== 输入处理 =====
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 200) + 'px';
  }

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function useSuggestion(text) {
    input.value = text;
    autoResize(input);
    sendMessage();
  }

  // ===== 发送消息 =====
  function sendMessage() {
    var text = input.value.trim();
    if (!text || isStreaming) return;

    // 确保有会话
    if (!currentSessionId || !chats[currentSessionId]) {
      newChat();
    }

    var chat = chats[currentSessionId];

    // 添加用户消息
    chat.messages.push({ role: 'user', content: text });

    // 更新标题（首次）
    if (chat.messages.length === 1) {
      chat.title = text.length > 20 ? text.substr(0, 20) + '...' : text;
      renderChatList();
    }

    // 添加空 assistant 消息
    chat.messages.push({ role: 'assistant', content: '' });

    // 渲染
    renderMessages();

    // 清空输入
    input.value = '';
    input.style.height = 'auto';

    // 切换按钮为停止
    isStreaming = true;
    sendBtn.classList.add('stop');
    sendBtn.setAttribute('title', '停止');
    sendBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

    // 发起请求
    abortController = new AbortController();

    fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: currentSessionId }),
      signal: abortController.signal
    })
    .then(function(res) {
      if (!res.ok) {
        return res.text().then(function(t) {
          throw new Error('HTTP ' + res.status + ': ' + t);
        });
      }
      return res.body;
    })
    .then(function(body) {
      if (!body) throw new Error('无响应数据');
      var reader = body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      var assistantContent = '';

      function read() {
        reader.read().then(function(result) {
          if (result.done) {
            finishStream();
            return;
          }
          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line || line.indexOf('data: ') !== 0) continue;
            try {
              var data = JSON.parse(line.slice(6));
              if (data.error) {
                assistantContent += '\n\n**错误:** ' + data.error;
                updateLastAssistant(assistantContent, false);
                finishStream();
                return;
              } else if (data.done) {
                finishStream();
                return;
              } else if (data.token) {
                assistantContent += data.token;
                updateLastAssistant(assistantContent, true);
                scrollToBottom();
              }
            } catch(e) {}
          }
          read();
        });
      }
      read();
    })
    .catch(function(err) {
      if (err.name === 'AbortError') {
        finishStream();
        return;
      }
      var chat2 = chats[currentSessionId];
      if (chat2 && chat2.messages.length > 0) {
        var last = chat2.messages[chat2.messages.length - 1];
        last.content = '**请求失败:** ' + err.message;
        updateLastAssistant(last.content, false);
      }
      finishStream();
    });
  }

  function stopStream() {
    if (abortController) {
      abortController.abort();
      abortController = null;
    }
    finishStream();
  }

  function finishStream() {
    isStreaming = false;
    sendBtn.classList.remove('stop');
    sendBtn.setAttribute('title', '发送');
    sendBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';

    // 更新最后一消息
    var msgs = chatContainer.querySelectorAll('.message.assistant .message-content');
    if (msgs.length > 0) {
      msgs[msgs.length - 1].classList.remove('streaming-cursor');
    }

    // 同步到 chats
    var chat = chats[currentSessionId];
    if (chat && chat.messages.length > 0) {
      var last = chat.messages[chat.messages.length - 1];
      var el = chatContainer.querySelector('.message.assistant:last-child .message-content');
      if (el && last.role === 'assistant') {
        last.content = el.textContent || last.content;
      }
    }

    input.focus();
  }

  // 发送/停止按钮切换
  sendBtn.addEventListener('click', function() {
    if (isStreaming) {
      stopStream();
    } else {
      sendMessage();
    }
  });

  // ===== 侧边栏 =====
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('collapsed');
  }

  function shareChat() {
    alert('分享功能开发中...');
  }

  function openSettings() {
    alert('设置功能开发中...');
  }

  // ===== 初始化 =====
  newChat();
</script>
</body>
</html>
